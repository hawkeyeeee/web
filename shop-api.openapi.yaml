        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [orders]
      operationId: createOrder
      summary: Оформить заказ
      security:
        - bearerAuth: [orders:write]
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreate'
            example:
              customer:
                name: Иван Петров
                email: ivan.petrov@example.com
                phone: '+79161234567'
              items:
                - product_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  quantity: 1
      responses:
        '201':
          description: Заказ создан
          headers:
            Location:
              description: URL созданного ресурса, например `/orders/501`
              schema:
                type: string
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Order'
              example:
                id: 501
                number: ORD-2026-000042
                customer:
                  name: Иван Петров
                  email: ivan.petrov@example.com
                  phone: '+79161234567'
                items:
                  - product_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    quantity: 1
                    unit_price: 149990
                status: pending
                total_amount: 149990
                created_at: '2026-02-05T09:00:00Z'
                updated_at: '2026-02-05T09:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /orders/{orderId}:
    get:
      tags: [orders]
      operationId: getOrder
      summary: Получить заказ по id
      security:
        - bearerAuth: [orders:read]
      parameters:
        - $ref: '#/components/parameters/orderId'
      responses:
        '200':
          description: Заказ найден
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Order'
              example:
                id: 501
                number: ORD-2026-000042
                customer:
                  name: Иван Петров
                  email: ivan.petrov@example.com
                  phone: '+79161234567'
                items:
                  - product_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    quantity: 1
                    unit_price: 149990
                status: confirmed
                total_amount: 149990
                created_at: '2026-02-05T09:00:00Z'
                updated_at: '2026-02-05T10:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /orders/{orderId}/status:
    patch:
      tags: [orders]
      operationId: updateOrderStatus
      summary: Изменить статус заказа
      security:
        - bearerAuth: [orders:write]
      parameters:
        - $ref: '#/components/parameters/orderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderStatusUpdate'
            example:
              status: confirmed
      responses:
        '200':
          description: Статус заказа изменён
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Order'
              example:
                id: 501
                number: ORD-2026-000042
                customer:
                  name: Иван Петров
                  email: ivan.petrov@example.com
                  phone: '+79161234567'
                items:
                  - product_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    quantity: 1
                    unit_price: 149990
                status: confirmed
                total_amount: 149990
                created_at: '2026-02-05T09:00:00Z'
                updated_at: '2026-02-05T10:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    page:
      name: page
      in: query
      description: Номер страницы, начиная с 1
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
      example: 1
    limit:
      name: limit
      in: query
      description: Размер страницы
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
      example: 20
    catalogId:
      name: catalogId
      in: path
      description: Числовой идентификатор каталога
      required: true
      schema:
        type: integer
        format: int64
      example: 1
    categoryId:
      name: categoryId
      in: path
      description: Числовой идентификатор категории
      required: true
      schema:
        type: integer
        format: int64
      example: 10
    productId:
      name: productId
      in: path
      description: UUID товара
      required: true
      schema:
        type: string
        format: uuid
      example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
    orderId:
      name: orderId
      in: path
      description: Числовой идентификатор заказа
      required: true
      schema:
        type: integer
        format: int64
      example: 501
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        format: uuid
      example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
    q:
      name: q
      in: query
      description: Поиск по `name`/`sku`, минимум 2 символа
      required: false
      schema:
        type: string
        minLength: 2
      example: ноутбук
    categoryIdFilter:
      name: category_id
      in: query
      description: Фильтр по идентификатору категории
      required: false
      schema:
        type: integer
        format: int64
      example: 10
    statusFilter:
      name: status
      in: query
      description: Фильтр по статусу товара
      required: false
      schema:
        $ref: '#/components/schemas/ProductStatus'
      example: active
    minPrice:
      name: min_price
      in: query
      description: Минимальная цена, рубли (включительно)
      required: false
      schema:
        type: integer
        format: int64
        minimum: 0
      example: 10000
    maxPrice:
      name: max_price
      in: query
      description: Максимальная цена, рубли (включительно)
      required: false
      schema:
        type: integer
        format: int64
        minimum: 0
      example: 200000
    sort:
      name: sort
      in: query
      description: Поле сортировки
      required: false
      schema:
        type: string
        enum: [name, price, created_at]
        default: created_at
      example: price
    direction:
      name: direction
      in: query
      description: Направление сортировки
      required: false
      schema:
        type: string
        enum: [asc, desc]
        default: desc
      example: asc
  headers:
    XRateLimitLimit:
      description: Максимальное число запросов в окне (100 в минуту на токен)
      schema:
        type: integer
      example: 100
    XRateLimitRemaining:
      description: Сколько запросов осталось до конца текущего окна
      schema:
        type: integer
      example: 42
    XRateLimitReset:
      description: Unix-время (секунды) сброса окна лимита
      schema:
        type: integer
        format: int64
      example: 1769875200
    RetryAfter:
      description: Через сколько секунд можно повторить запрос
      schema:
        type: integer
      example: 30
    Deprecation:
      description: Признак, что версия эндпоинта устарела (true, если устарела)
      schema:
        type: boolean
      example: false
    Sunset:
      description: Дата прекращения поддержки версии, RFC 1123
      schema:
        type: string
      example: Mon, 01 Jun 2026 00:00:00 GMT
  responses:
    BadRequest:
      description: Некорректный запрос (невалидный JSON, битый UUID/число в пути или query)
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: https://api.shop.example/errors/invalid-request
            title: Invalid request
            status: 400
            detail: "Parameter 'productId' is not a valid UUID"
            instance: /v1/products/not-a-uuid
    Unauthorized:
      description: Токен отсутствует или просрочен
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: https://api.shop.example/errors/unauthorized
            title: Unauthorized
            status: 401
            detail: Access token is missing or expired
            instance: /v1/orders
    Forbidden:
      description: Токен валиден, но у него нет нужного scope
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: https://api.shop.example/errors/forbidden
            title: Forbidden
            status: 403
            detail: "Token is missing required scope 'orders:read'"
            instance: /v1/orders
    NotFound:
      description: Ресурс не найден
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: https://api.shop.example/errors/product-not-found
            title: Product not found
            status: 404
            detail: "Product with id '3fa85f64-5717-4562-b3fc-2c963f66afa6' was not found"
            instance: /v1/products/3fa85f64-5717-4562-b3fc-2c963f66afa6
    Conflict:
      description: Конфликт состояния или уникальности
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: https://api.shop.example/errors/duplicate-sku
            title: Duplicate SKU
            status: 409
            detail: "SKU 'NB-IGR-156' already exists"
            instance: /v1/products
            errors:
              - field: sku
                code: duplicate
                message: "SKU 'NB-IGR-156' already exists"
    UnprocessableEntity:
      description: Тело валидно по схеме, но нарушает бизнес-правило
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: https://api.shop.example/errors/product-unavailable
            title: Product unavailable
            status: 422
            detail: "Product '3fa85f64-5717-4562-b3fc-2c963f66afa6' is out of stock"
            instance: /v1/orders
            errors:
              - field: items[0].product_id
                code: out_of_stock
                message: Requested quantity exceeds available stock
    TooManyRequests:
      description: Превышен лимит запросов (100 в минуту на токен)
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: https://api.shop.example/errors/rate-limit-exceeded
            title: Too many requests
            status: 429
            detail: Rate limit of 100 requests per minute exceeded
            instance: /v1/products
    InternalError:
      description: Непредвиденная ошибка сервера
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: https://api.shop.example/errors/internal-server-error
            title: Internal server error
            status: 500
            detail: An unexpected error occurred
            instance: /v1/products
  schemas:
    Error:
      type: object
      description: Единый формат ошибки, RFC 9457 (`application/problem+json`)
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          format: uri
          description: URI типа ошибки, см. таблицу в `info.description`
          example: https://api.shop.example/errors/product-not-found
        title:
          type: string
          description: Краткое человекочитаемое название ошибки
          example: Product not found
        status:
          type: integer
          description: HTTP-код ответа, продублированный в теле
          example: 404
        detail:
          type: string
          description: Контекст конкретного случая — что именно не так
          example: "Product with id '3fa85f64-5717-4562-b3fc-2c963f66afa6' was not found"
        instance:
          type: string
          description: Путь запроса, вызвавшего ошибку
          example: /v1/products/3fa85f64-5717-4562-b3fc-2c963f66afa6
        errors:
          type: array
          description: "Полевые ошибки. Обязателен при `status: 422`, для остальных кодов — опционален"
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
          description: Путь до невалидного поля в теле запроса
          example: sku
        code:
          type: string
          description: Машиночитаемый код ошибки поля
          example: duplicate
        message:
          type: string
          description: Человекочитаемое пояснение
          example: "SKU 'ABC-123' already exists"
    Pagination:
      type: object
      required: [page, limit, total_items, total_pages, has_next, has_prev]
      properties:
        page:
          type: integer
          format: int32
          description: Текущая страница
          example: 1
        limit:
          type: integer
          format: int32
          description: Размер страницы
          example: 20
        total_items:
          type: integer
          format: int64
          description: Общее число элементов, удовлетворяющих фильтрам
          example: 137
        total_pages:
          type: integer
          format: int32
          description: Общее число страниц
          example: 7
        has_next:
          type: boolean
          description: Есть ли следующая страница
          example: true
        has_prev:
          type: boolean
          description: Есть ли предыдущая страница
          example: false
    Catalog:
      type: object
      required: [id, name, is_active, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          description: Идентификатор, генерируется сервером
          example: 1
        name:
          type: string
          minLength: 3
          maxLength: 100
          description: Название каталога
          example: Электроника
        description:
          type: string
          maxLength: 500
          description: Развёрнутое описание каталога
          example: Смартфоны, ноутбуки, аудиотехника и аксессуары
        is_active:
          type: boolean
          default: true
          description: Виден ли каталог в витрине
          example: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: Дата и время создания, UTC (RFC 3339)
          example: '2026-01-10T08:00:00Z'
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: Дата и время последнего обновления, UTC (RFC 3339)
          example: '2026-01-10T08:00:00Z'
    CatalogCreate:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
          example: Электроника
        slug:
          type: string
          minLength: 2
          maxLength: 60
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          description: Уникальный slug, используется только при создании
          example: elektronika
        description:
          type: string
          maxLength: 500
          example: Смартфоны, ноутбуки, аудиотехника и аксессуары
        is_active:
          type: boolean
          default: true
          example: true
    CatalogUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
          example: Электроника и бытовая техника
        slug:
          type: string
          minLength: 2
          maxLength: 60
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          example: elektronika
        description:
          type: string
          maxLength: 500
          example: Смартфоны, ноутбуки, аудиотехника, умные часы
        is_active:
          type: boolean
          example: true
    CatalogList:
      type: object
      description: Конверт ответа списка каталогов
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Catalog'
        pagination:
          $ref: '#/components/schemas/Pagination'
    Category:
      type: object
      required: [id, catalog_id, name, slug, sort_order, is_active, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          example: 10
        catalog_id:
          type: integer
          format: int64
          description: Идентификатор родительского каталога
          example: 1
        name:
          type: string
          minLength: 2
          maxLength: 120
          example: Ноутбуки
        slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          description: Уникален в пределах каталога (может повторяться в другом каталоге)
          example: noutbuki
        image_url:
          type: string
          format: uri
          example: https://cdn.shop.example/categories/noutbuki.jpg
        sort_order:
          type: integer
          format: int32
          default: 0
          description: Порядок отображения внутри каталога
          example: 0
        is_active:
          type: boolean
          default: true
          example: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          example: '2026-01-11T10:00:00Z'
        updated_at:
          type: string
          format: date-time
          readOnly: true
          example: '2026-01-11T10:00:00Z'
    CategoryCreate:
      type: object
      description: Тело запроса `POST /catalogs/{catalogId}/categories`
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
          example: Ноутбуки
        slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          example: noutbuki
        image_url:
          type: string
          format: uri
          example: https://cdn.shop.example/categories/noutbuki.jpg
        sort_order:
          type: integer
          format: int32
          default: 0
          example: 0
        is_active:
          type: boolean
          default: true
          example: true
    CategoryUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
          example: Ноутбуки и ультрабуки
        slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          example: noutbuki
        image_url:
          type: string
          format: uri
          example: https://cdn.shop.example/categories/noutbuki.jpg
        sort_order:
          type: integer
          format: int32
          example: 1
        is_active:
          type: boolean
          example: true
    CategoryList:
      type: object
      description: Конверт ответа списка категорий
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        pagination:
          $ref: '#/components/schemas/Pagination'
    ProductStatus:
      type: string
      description: Статус жизненного цикла товара
      enum: [draft, active, archived]
      default: draft
      example: active
    Product:
      type: object
      description: Карточка товара (схема ответа на чтение)
      required: [id, sku, name, category_id, price, stock, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Идентификатор товара (UUID v4), генерируется сервером
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        sku:
          type: string
          minLength: 5
          maxLength: 32
          pattern: '^[A-Z0-9-]+$'
          description: Уникальный артикул
          example: NB-IGR-156
        name:
          type: string
          minLength: 2
          maxLength: 200
          example: Игровой ноутбук 15.6"
        description:
          type: string
          maxLength: 5000
          example: Intel Core i7, RTX 4060, 16 ГБ ОЗУ, 1 ТБ SSD
        category_id:
          type: integer
          format: int64
          description: "Категория должна существовать и быть активной (`is_active: true`)"
          example: 10
        price:
          type: integer
          format: int64
          minimum: 0
          maximum: 10000000
          description: Цена, целые рубли
          example: 149990
        stock:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000000
          description: Остаток на складе, штук
          example: 12
        status:
          allOf:
            - $ref: '#/components/schemas/ProductStatus'
        images:
          type: array
          maxItems: 10
          items:
            type: string
            format: uri
          example:
            - https://cdn.shop.example/products/nb-igr-156/1.jpg
        created_at:
          type: string
          format: date-time
          readOnly: true
          example: '2026-01-15T12:00:00Z'
        updated_at:
          type: string
          format: date-time
          readOnly: true
          example: '2026-01-20T08:30:00Z'
    ProductCreate:
      type: object
      required: [sku, name, category_id, price, stock]
      properties:
        sku:
          type: string
          minLength: 5
          maxLength: 32
          pattern: '^[A-Z0-9-]+$'
          example: NB-IGR-156
        name:
          type: string
          minLength: 2
          maxLength: 200
          example: Игровой ноутбук 15.6"
        description:
          type: string
          maxLength: 5000
          example: Intel Core i7, RTX 4060, 16 ГБ ОЗУ, 1 ТБ SSD
        category_id:
          type: integer
          format: int64
          example: 10
        price:
          type: integer
          format: int64
          minimum: 0
          maximum: 10000000
          example: 149990
        stock:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000000
          example: 12
        status:
          $ref: '#/components/schemas/ProductStatus'
        images:
          type: array
          maxItems: 10
          items:
            type: string
            format: uri
          example:
            - https://cdn.shop.example/products/nb-igr-156/1.jpg
    ProductUpdate:
      type: object
      properties:
        sku:
          type: string
          minLength: 5
          maxLength: 32
          pattern: '^[A-Z0-9-]+$'
          example: NB-IGR-156
        name:
          type: string
          minLength: 2
          maxLength: 200
          example: Игровой ноутбук 15.6"
        description:
          type: string
          maxLength: 5000
          example: Intel Core i7, RTX 4060, 16 ГБ ОЗУ, 1 ТБ SSD
        category_id:
          type: integer
          format: int64
          example: 10
        price:
          type: integer
          format: int64
          minimum: 0
          maximum: 10000000
          example: 139990
        stock:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000000
          example: 20
        status:
          $ref: '#/components/schemas/ProductStatus'
        images:
          type: array
          maxItems: 10
          items:
            type: string
            format: uri
    ProductList:
      type: object
      description: Конверт ответа списка товаров
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        pagination:
          $ref: '#/components/schemas/Pagination'
    Customer:
      type: object
      description: Контактные данные покупателя, указанные при оформлении заказа
      required: [name, email, phone]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
          example: Иван Петров
        email:
          type: string
          format: email
          example: ivan.petrov@example.com
        phone:
          type: string
          pattern: '^\+[1-9]\d{6,14}$'
          description: Телефон в формате E.164
          example: '+79161234567'
    OrderItem:
      type: object
      required: [product_id, quantity, unit_price]
      properties:
        product_id:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 999
          example: 1
        unit_price:
          type: integer
          format: int64
          readOnly: true
          description: Копия цены товара на момент оформления заказа, рубли
          example: 149990
    OrderItemCreate:
      type: object
      required: [product_id, quantity]
      properties:
        product_id:
          type: string
          format: uuid
          description: "Товар должен существовать, иметь `status: active` и `stock >= quantity`"
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 999
          example: 1
    OrderStatus:
      type: string
      enum: [pending, confirmed, shipped, delivered, cancelled]
      default: pending
      example: pending
    Order:
      type: object
      description: Заказ (схема ответа)
      required: [id, number, customer, items, status, total_amount, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          example: 501
        number:
          type: string
          readOnly: true
          pattern: '^ORD-\d{4}-\d{6}$'
          description: Номер заказа, генерируется сервером
          example: ORD-2026-000042
        customer:
          $ref: '#/components/schemas/Customer'
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/OrderItem'
        status:
          allOf:
            - $ref: '#/components/schemas/OrderStatus'
        total_amount:
          type: integer
          format: int64
          readOnly: true
          description: Сумма `unit_price * quantity` по всем позициям, считается сервером
          example: 149990
        created_at:
          type: string
          format: date-time
          readOnly: true
          example: '2026-02-05T09:00:00Z'
        updated_at:
          type: string
          format: date-time
          readOnly: true
          example: '2026-02-05T09:00:00Z'
    OrderCreate:
      type: object
      required: [customer, items]
      properties:
        customer:
          $ref: '#/components/schemas/Customer'
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/OrderItemCreate'
    OrderStatusUpdate:
      type: object
      description: Тело запроса `PATCH /orders/{orderId}/status`
      required: [status]
      properties:
        status:
          type: string
          description: Целевой статус. `pending` недопустим как цель перехода (это только начальный статус)
          enum: [confirmed, shipped, delivered, cancelled]
          example: confirmed
    OrderList:
      type: object
      description: Конверт ответа списка заказов
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        pagination:
          $ref: '#/components/schemas/Pagination'