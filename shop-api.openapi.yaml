      parameters:
        - $ref: '#/components/parameters/catalogId'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/CatalogUpdate'
            example:
              description: Смартфоны, ноутбуки, аудиотехника, умные часы
              is_active: true
      responses:
        '200':
          description: Каталог обновлён
          content:
            application/json; charset=utf-8:
