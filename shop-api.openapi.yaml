                id: 1
                name: Электроника
                description: Смартфоны, ноутбуки, аудиотехника и аксессуары
                is_active: true
                created_at: '2026-01-10T08:00:00Z'
                updated_at: '2026-01-10T08:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
