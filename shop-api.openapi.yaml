openapi: 3.0.3
info:
  title: Shop API
  version: 1.0.0
  description: |
    ## Назначение
    REST API интернет-магазина: каталоги, категории, товары, заказы.

    ## 
    | 400 | `invalid-request` | не-JSON тело, битый UUID/число в пути или query |
    | 401 | `unauthorized` | токен отсутствует или просрочен |
    | 403 | `forbidden` | токен валиден, но нет нужного scope |
    | 404 | `catalog-not-found` | каталог с данным id не найден |
    | 404 | `category-not-found` | категория с данным id не найдена |
    | 404 | `product-not-found` | товар с данным id не найден |
    | 404 | `order-not-found` | заказ с данным id не найден |
    | 409 | `duplicate-slug` | slug каталога/категории уже занят |
    | 409 | `duplicate-sku` | SKU товара уже занят |
    | 409 | `catalog-has-categories` | удаление каталога с непустым списком категорий |
    | 409 | `idempotency-key-reuse` | тот же `Idempotency-Key`, но другое тело запроса |
    | 422 | `validation-error` | тело валидно по JSON-схеме, но нарушает бизнес-правило (например, `category_id` указывает на неактивную категорию) |
    | 422 | `invalid-status-transition` | недопустимый переход статуса заказа |
    | 422 | `product-unavailable` | товар в заказе не `active` или `stock = 0` |
    | 429 | `rate-limit-exceeded` | превышен лимит запросов |
    | 500 | `internal-server-error` | непредвиденная ошибка сервера, детали не раскрываются |
  contact:
    name: API Team
    email: api@shop.example
    url: https://shop.example/developers
servers:
  - url: https://staging.api.shop.example/v1
    description: Staging
  - url: https://api.shop.example/v1
    description: Production
tags:
  - name: catalogs
    description: Управление каталогами
  - name: categories
    description: Иерархия категорий внутри каталогов
  - name: products
    description: Карточки товаров и их жизненный цикл
  - name: orders
    description: Оформление заказов, позиции заказа и переходы статуса
security:
  - bearerAuth: []
paths:
  /catalogs:
    get:
      tags: [catalogs]
      operationId: listCatalogs
      summary: Список каталогов
      security: []
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Список каталогов
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/CatalogList'
              example:
                data:
                  - id: 1
                    name: Электроника
                    is_active: true
                    created_at: '2026-01-10T08:00:00Z'
                    updated_at: '2026-01-10T08:00:00Z'
                  - id: 2
                    name: Одежда
                    is_active: true
                    created_at: '2026-01-12T09:30:00Z'
                    updated_at: '2026-01-12T09:30:00Z'
                pagination:
                  page: 1
                  limit: 20
                  total_items: 2
                  total_pages: 1
                  has_next: false
                  has_prev: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [catalogs]
      operationId: createCatalog
      summary: Создать каталог
      security:
        - bearerAuth: [catalogs:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogCreate'
            example:
              name: Электроника
              slug: elektronika
              description: Смартфоны, ноутбуки, аудиотехника и аксессуары
      responses:
        '201':
          description: Каталог создан
          headers:
            Location:
              description: URL созданного ресурса, например `/catalogs/1`
              schema:
                type: string
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Catalog'
              example:
                id: 1
                name: Электроника
                description: Смартфоны, ноутбуки, аудиотехника и аксессуары
                is_active: true
                created_at: '2026-01-10T08:00:00Z'
                updated_at: '2026-01-10T08:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /catalogs/{catalogId}:
    get:
      tags: [catalogs]
      operationId: getCatalog
      summary: Получить каталог по id
      security: []
      parameters:
        - $ref: '#/components/parameters/catalogId'
      responses:
        '200':
          description: Каталог найден
